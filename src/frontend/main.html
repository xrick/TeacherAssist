<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡報AI - 專業簡報生成器</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --secondary-color: #10B981;
            --accent-color: #F59E0B;
            --background: #FFFFFF;
            --surface: #F8FAFC;
            --surface-elevated: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --border: #E5E7EB;
            --border-light: #F3F4F6;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', 'Segoe UI', Roboto, sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--background);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: var(--surface);
            color: var(--text-primary);
        }

        /* Main Layout */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            min-height: calc(100vh - 80px);
        }

        /* Left Panel - Input Area */
        .input-panel {
            background: var(--surface-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2rem;
            height: fit-content;
        }

        .panel-header {
            margin-bottom: 1.5rem;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .panel-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s ease;
            background: var(--background);
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgb(79 70 229 / 0.1);
        }

        .text-input::placeholder {
            color: var(--text-muted);
        }

        .input-meta {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .char-count {
            margin-left: auto;
        }

        /* Template Selection */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .template-card {
            border: 2px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--background);
        }

        .template-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .template-card.selected {
            border-color: var(--primary-color);
            background: rgb(79 70 229 / 0.05);
        }

        .template-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .template-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            border: none;
            border-radius: var(--radius-md);
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            flex: 1;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface);
            color: var(--text-primary);
        }

        .btn-loading {
            position: relative;
            color: transparent;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Right Panel - Preview Area */
        .preview-panel {
            background: var(--surface-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2rem;
            position: sticky;
            top: 100px;
            height: fit-content;
            max-height: calc(100vh - 120px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: var(--text-muted);
            text-align: center;
        }

        .preview-empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .preview-empty-text {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .preview-empty-hint {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Progress Section */
        .progress-section {
            display: none;
            padding: 2rem;
            text-align: center;
        }

        .progress-section.show {
            display: block;
        }

        .progress-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .progress-text {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .progress-hint {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-light);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-percentage {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Results Section */
        .results-section {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .results-section.show {
            display: flex;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .results-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .results-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .slides-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }

        .slide-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .slide-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .slide-thumbnail {
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            position: relative;
        }

        .slide-number {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.625rem;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
        }

        .slide-title {
            padding: 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            border-top: 1px solid var(--border);
            background: var(--background);
        }

        .export-actions {
            display: flex;
            gap: 0.75rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .export-btn {
            flex: 1;
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: var(--radius-md);
            padding: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .export-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .export-btn.primary {
            background: var(--primary-color);
            color: white;
        }

        .export-btn.primary:hover {
            background: var(--primary-hover);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 1rem;
            }

            .preview-panel {
                position: static;
                max-height: none;
            }

            .template-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .header {
                padding: 1rem;
            }

            .input-panel,
            .preview-panel {
                padding: 1.5rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .export-actions {
                flex-direction: column;
            }

            .slides-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="#" class="logo">
                <div class="logo-icon">📊</div>
                簡報AI
            </a>
            <div class="header-actions">
                <button class="theme-toggle" id="theme-toggle" title="切換主題">
                    🌙
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Left Panel - Input Area -->
        <section class="input-panel">
            <div class="panel-header">
                <h2 class="panel-title">建立您的簡報</h2>
                <p class="panel-subtitle">輸入您的內容，讓AI為您生成專業簡報</p>
            </div>

            <div class="input-group">
                <label for="content-input" class="input-label">內容輸入</label>
                <textarea 
                    id="content-input" 
                    class="text-input" 
                    placeholder="請在此處貼上或輸入您的內容...

範例：
• 會議記錄
• 課程大綱
• 產品介紹
• 研究成果
• 商業提案

AI 將自動分析您的內容並建立結構化的投影片。"
                ></textarea>
                <div class="input-meta">
                    <span class="input-hint">至少需要 50 個字元</span>
                    <span class="char-count" id="char-count">0 個字元</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">模板樣式</label>
                <div class="template-grid">
                    <div class="template-card selected" data-template="administrative">
                        <div class="template-icon">💼</div>
                        <div class="template-name">行政簡報</div>
                    </div>
                    <div class="template-card" data-template="educational">
                        <div class="template-icon">🎓</div>
                        <div class="template-name">教學簡報</div>
                    </div>
                    <div class="template-card" data-template="general">
                        <div class="template-icon">🎨</div>
                        <div class="template-name">一般簡報</div>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="generate-btn" class="btn btn-primary" disabled>
                    <span>✨ 生成簡報</span>
                </button>
                <button id="clear-btn" class="btn btn-secondary">
                    <span>🗑️ 清除</span>
                </button>
            </div>
        </section>

        <!-- Right Panel - Preview Area -->
        <section class="preview-panel">
            <!-- Empty State -->
            <div id="preview-empty" class="preview-empty">
                <div class="preview-empty-icon">📋</div>
                <div class="preview-empty-text">準備開始建立</div>
                <div class="preview-empty-hint">請輸入您的內容並點擊「生成簡報」來查看預覽</div>
            </div>

            <!-- Progress State -->
            <div id="progress-section" class="progress-section">
                <div class="progress-icon">⚡</div>
                <div class="progress-text" id="progress-text">正在分析內容...</div>
                <div class="progress-hint">通常需要 30-60 秒鐘</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-percentage" id="progress-percentage">0%</div>
            </div>

            <!-- Results State -->
            <div id="results-section" class="results-section">
                <div class="results-header">
                    <div>
                        <div class="results-title">簡報已準備完成</div>
                        <div class="results-meta" id="results-meta">已生成 6 張投影片</div>
                    </div>
                </div>

                <div class="slides-grid" id="slides-grid">
                    <!-- Slides will be generated here -->
                </div>

                <div class="export-actions">
                    <a href="#" class="export-btn primary" id="download-pptx">
                        📄 下載 PowerPoint
                    </a>
                    <a href="#" class="export-btn" id="download-pdf">
                        📑 下載 PDF
                    </a>
                    <button class="export-btn" id="share-btn">
                        🔗 分享連結
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        class PresentationApp {
            constructor() {
                this.selectedTemplate = 'administrative';
                this.currentPresentation = null;
                this.init();
            }

            init() {
                this.bindElements();
                this.bindEvents();
                this.updateCharCount();
            }

            bindElements() {
                this.contentInput = document.getElementById('content-input');
                this.charCount = document.getElementById('char-count');
                this.generateBtn = document.getElementById('generate-btn');
                this.clearBtn = document.getElementById('clear-btn');
                this.themeToggle = document.getElementById('theme-toggle');
                
                this.previewEmpty = document.getElementById('preview-empty');
                this.progressSection = document.getElementById('progress-section');
                this.resultsSection = document.getElementById('results-section');
                
                this.progressText = document.getElementById('progress-text');
                this.progressFill = document.getElementById('progress-fill');
                this.progressPercentage = document.getElementById('progress-percentage');
                
                this.slidesGrid = document.getElementById('slides-grid');
                this.resultsMeta = document.getElementById('results-meta');
                
                this.templateCards = document.querySelectorAll('.template-card');
            }

            bindEvents() {
                this.contentInput.addEventListener('input', () => this.updateCharCount());
                this.generateBtn.addEventListener('click', () => this.generatePresentation());
                this.clearBtn.addEventListener('click', () => this.clearContent());
                this.themeToggle.addEventListener('click', () => this.toggleTheme());
                
                this.templateCards.forEach(card => {
                    card.addEventListener('click', () => this.selectTemplate(card));
                });

                document.getElementById('download-pptx').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.downloadFile('pptx');
                });

                document.getElementById('download-pdf').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.downloadFile('pdf');
                });

                document.getElementById('share-btn').addEventListener('click', () => {
                    this.sharePresentation();
                });
            }

            updateCharCount() {
                const length = this.contentInput.value.length;
                this.charCount.textContent = `${length} 個字元`;
                this.generateBtn.disabled = length < 50;
            }

            selectTemplate(selectedCard) {
                this.templateCards.forEach(card => card.classList.remove('selected'));
                selectedCard.classList.add('selected');
                this.selectedTemplate = selectedCard.dataset.template;
            }

            clearContent() {
                this.contentInput.value = '';
                this.updateCharCount();
                this.showEmptyState();
            }

            async generatePresentation() {
                const content = this.contentInput.value.trim();
                if (content.length < 50) return;

                this.showProgressState();
                this.generateBtn.classList.add('btn-loading');
                this.generateBtn.disabled = true;

                try {
                    await this.simulateGeneration();
                    this.generateSlides(content);
                    this.showResultsState();
                } catch (error) {
                    console.error('生成失敗:', error);
                    alert('生成簡報失敗，請稍後再試。');
                    this.showEmptyState();
                } finally {
                    this.generateBtn.classList.remove('btn-loading');
                    this.generateBtn.disabled = false;
                }
            }

            async simulateGeneration() {
                const steps = [
                    { text: '正在分析內容結構...', progress: 20 },
                    { text: '正在識別關鍵主題...', progress: 40 },
                    { text: '正在建立投影片佈局...', progress: 60 },
                    { text: '正在生成內容...', progress: 80 },
                    { text: '正在完成簡報...', progress: 100 }
                ];

                for (const step of steps) {
                    this.progressText.textContent = step.text;
                    this.progressFill.style.width = step.progress + '%';
                    this.progressPercentage.textContent = step.progress + '%';
                    await new Promise(resolve => setTimeout(resolve, 800));
                }
            }

            generateSlides(content) {
                // 基於內容模擬投影片生成
                const sentences = content.split(/[.!?]+/).filter(s => s.trim().length > 10);
                const slideCount = Math.min(Math.max(Math.ceil(sentences.length / 3), 3), 8);
                
                const slides = [
                    { title: '標題頁', type: 'title' },
                    { title: '概述', type: 'overview' },
                    ...Array.from({ length: slideCount - 3 }, (_, i) => ({
                        title: `重點 ${i + 1}`,
                        type: 'content'
                    })),
                    { title: '結論', type: 'conclusion' }
                ];

                this.renderSlides(slides);
                this.currentPresentation = { slides, template: this.selectedTemplate };
            }

            renderSlides(slides) {
                this.slidesGrid.innerHTML = '';
                this.resultsMeta.textContent = `已生成 ${slides.length} 張投影片`;

                slides.forEach((slide, index) => {
                    const slideElement = document.createElement('div');
                    slideElement.className = 'slide-card slide-in';
                    slideElement.style.animationDelay = `${index * 0.1}s`;
                    
                    slideElement.innerHTML = `
                        <div class="slide-thumbnail">
                            <div class="slide-number">${index + 1}</div>
                            <div>${this.getSlideIcon(slide.type)}</div>
                        </div>
                        <div class="slide-title">${slide.title}</div>
                    `;
                    
                    this.slidesGrid.appendChild(slideElement);
                });
            }

            getSlideIcon(type) {
                const icons = {
                    title: '📋',
                    overview: '🗂️',
                    content: '📝',
                    conclusion: '🎯'
                };
                return icons[type] || '📄';
            }

            showEmptyState() {
                this.previewEmpty.style.display = 'flex';
                this.progressSection.classList.remove('show');
                this.resultsSection.classList.remove('show');
            }

            showProgressState() {
                this.previewEmpty.style.display = 'none';
                this.progressSection.classList.add('show');
                this.resultsSection.classList.remove('show');
            }

            showResultsState() {
                this.previewEmpty.style.display = 'none';
                this.progressSection.classList.remove('show');
                this.resultsSection.classList.add('show');
            }

            downloadFile(format) {
                if (!this.currentPresentation) return;
                
                // 模擬檔案生成和下載
                const filename = `簡報_${Date.now()}.${format}`;
                alert(`正在準備 ${format.toUpperCase()} 下載：${filename}`);
                
                // 在實際實作中，這裏會觸發真實的檔案下載
                console.log('下載中:', {
                    format,
                    slides: this.currentPresentation.slides.length,
                    template: this.currentPresentation.template
                });
            }

            sharePresentation() {
                if (!this.currentPresentation) return;
                
                const shareUrl = `${window.location.origin}/share/${Math.random().toString(36).substr(2, 9)}`;
                
                if (navigator.share) {
                    navigator.share({
                        title: '我的AI生成簡報',
                        text: '看看我用簡報AI建立的這個簡報',
                        url: shareUrl
                    });
                } else {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        alert('分享連結已複製到剪貼簿！');
                    });
                }
            }

            toggleTheme() {
                const isDark = document.body.classList.toggle('dark-theme');
                this.themeToggle.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }
        }

        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', () => {
            new PresentationApp();
        });
    </script>
</body>
</html>
