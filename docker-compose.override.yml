services:
  presenton:
    image: ${PRESENTON_IMAGE:-ghcr.io/presenton/presenton:latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
       - "8001:8000" #API Port (external 8001 -> internal 8000)
      # - "8001:3000" #Frontend Port
    environment:
      - ENABLE_WEB_SEARCH=false
      - OLLAMA_MODE=qwen3:14b
    volumes:
      - ./app_data/chroma:/app/servers/fastapi/chroma
      - ./app_data/exports:/app_data/exports  # Share exports directory with backend
