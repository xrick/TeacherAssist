version: '3.8'

#docker run -it --name presenton -p 5000:80 -v "./app_data:/app_data" 
#ghcr.io/presenton/presenton:latest

services:
  presenton:
    image: ghcr.io/presenton/presenton:latest
    container_name: presenton-api
    environment:
      - PRESENTON_API_KEY=sk-presenton-2a1d7db68395f4aaedbca4eb3a82b5c8797c26e3187ea4c2ab5079693e6b9822f576ac900b00e02bc63f44eefb5111db45decec946e95ad482cf73655f2c356e
      - LLM=ollama
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - IMAGE_PROVIDER=pexels
      - PEXELS_API_KEY=kKOp88XcQabMQH1lCUMSMjqNRByDrHuFNe3ED4FzkQ4rsg2Yv9peyRA6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ppt-backend
    ports:
      - "5050:5000"
    environment:
      - PRESENTON_API_URL=http://presenton:8000
      - PRESENTON_API_KEY=sk-presenton-2a1d7db68395f4aaedbca4eb3a82b5c8797c26e3187ea4c2ab5079693e6b9822f576ac900b00e02bc63f44eefb5111db45decec946e95ad482cf73655f2c356e
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - PEXELS_API_KEY=kKOp88XcQabMQH1lCUMSMjqNRByDrHuFNe3ED4FzkQ4rsg2Yv9peyRA6
      - CORS_ORIGINS=*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./output:/app/output
    depends_on:
      - presenton
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge