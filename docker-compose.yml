# Docker Compose configuration for TeacherAssist
# Note: 'version' field is deprecated in Compose v2, removed for compatibility

#docker run -it --name presenton -p 5000:80 -v "./app_data:/app_data"
#ghcr.io/presenton/presenton:latest

services:
  presenton:
    image: ${PRESENTON_IMAGE:-ghcr.io/presenton/presenton:latest}
    container_name: presenton-api
    # platform: ${DOCKER_PLATFORM:-linux/amd64}  # Commented out to allow auto-detection
    environment:
      - PRESENTON_API_KEY=sk-presenton-2a1d7db68395f4aaedbca4eb3a82b5c8797c26e3187ea4c2ab5079693e6b9822f576ac900b00e02bc63f44eefb5111db45decec946e95ad482cf73655f2c356e
      - LLM=ollama
      - WEB_GROUNDING=false
      - TOOL_CALLS=false
      # - OLLAMA_URL=http://host.docker.internal:11434  # home (local Ollama)
      - OLLAMA_URL=http://192.168.200.48:11434  # office (default, currently unavailable)
      - OLLAMA_MODEL=gpt-oss:20b  #phi4-mini:3.8b
      - IMAGE_PROVIDER=pexels
      - PEXELS_API_KEY=kKOp88XcQabMQH1lCUMSMjqNRByDrHuFNe3ED4FzkQ4rsg2Yv9peyRA6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app_data:/app_data
    networks:
      - app-network
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-teacherassist-backend:latest}
    build:
      context: ./backend
      # platforms:
      #   - ${DOCKER_PLATFORM:-linux/amd64}
    container_name: ppt-backend
    # platform: ${DOCKER_PLATFORM:-linux/amd64}  # Commented out to allow auto-detection
    ports:
      - "5050:5000"
    environment:
      - PRESENTON_API_URL=http://presenton:8000 #API Port
      # - PRESENTON_API_URL=http://presenton:3000 #Frontend Port
      - PRESENTON_API_KEY=sk-presenton-2a1d7db68395f4aaedbca4eb3a82b5c8797c26e3187ea4c2ab5079693e6b9822f576ac900b00e02bc63f44eefb5111db45decec946e95ad482cf73655f2c356e
      # - OLLAMA_URL=http://host.docker.internal:11434  # home (local Ollama)
      - OLLAMA_URL=http://192.168.200.48:11434  # office (default, currently unavailable)
      - OLLAMA_MODEL=gpt-oss:20b    #phi4-mini:3.8b
      - PEXELS_API_KEY=kKOp88XcQabMQH1lCUMSMjqNRByDrHuFNe3ED4FzkQ4rsg2Yv9peyRA6
      - CORS_ORIGINS=*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./output:/app/output
      - ./app_data/exports:/app_data/exports  # Share exports directory with presenton
      - ./ppt_templates:/ppt_templates  # Custom PPTX templates for enhancement pipeline
    depends_on:
      - presenton
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge