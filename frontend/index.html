<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡報AI - 專業簡報生成器</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --secondary-color: #10B981;
            --accent-color: #F59E0B;
            --background: #FFFFFF;
            --surface: #F8FAFC;
            --surface-elevated: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --border: #E5E7EB;
            --border-light: #F3F4F6;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', 'Segoe UI', Roboto, sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: var(--background);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(300px, 400px) 1fr minmax(400px, 500px);
            gap: 1.5rem;
            padding: 2rem;
            min-height: calc(100vh - 80px);
        }

        .input-panel, .middle-panel, .preview-panel {
            background: var(--surface-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2rem;
        }

        .input-panel {
            display: flex;
            flex-direction: column;
        }

        .middle-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .panel-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .slide-count-control {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .slide-count-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--background);
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-count-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background: rgb(79 70 229 / 0.05);
            transform: scale(1.05);
        }

        .slide-count-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .template-upload-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .template-upload-btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--background);
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .template-upload-btn:hover {
            border-color: var(--primary-color);
            background: rgb(79 70 229 / 0.05);
        }

        .template-upload-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border: 2px solid var(--success-color);
            border-radius: var(--radius-md);
            background: rgb(16 185 129 / 0.05);
        }

        .template-filename {
            flex: 1;
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        .template-remove-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: var(--danger-color);
            color: white;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .template-remove-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .slide-count-input {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            background: var(--surface);
            color: var(--text-primary);
        }

        .title-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            background: var(--background);
            color: var(--text-primary);
        }

        .title-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgb(79 70 229 / 0.1);
        }

        .title-input::placeholder {
            color: var(--text-muted);
        }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s ease;
            background: var(--background);
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgb(79 70 229 / 0.1);
        }

        .input-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .template-card {
            border: 2px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--background);
        }

        .template-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .template-card.selected {
            border-color: var(--primary-color);
            background: rgb(79 70 229 / 0.05);
        }

        .template-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .template-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            border: none;
            border-radius: var(--radius-md);
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            flex: 1;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface);
            color: var(--text-primary);
        }

        .btn-loading::after {
            content: '';
            width: 16px;
            height: 16px;
            margin-left: 0.5rem;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .preview-panel {
            position: sticky;
            top: 100px;
            height: fit-content;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .slide-preview {
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-muted);
        }

        .slide-preview-empty {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            padding: 2rem;
        }

        .slide-preview-transcript {
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--text-primary);
            max-height: 300px;
            overflow-y: auto;
        }

        .slide-preview-transcript h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .preview-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: var(--text-muted);
            text-align: center;
        }

        .preview-empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .progress-section {
            display: none;
            padding: 2rem;
            text-align: center;
        }

        .progress-section.show {
            display: block;
        }

        .progress-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-light);
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.3s ease;
        }

        .results-section {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .results-section.show {
            display: flex;
        }

        .results-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .slides-grid {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.5rem 0;
            margin-bottom: 1.5rem;
        }

        .slide-card {
            min-width: 180px;
            max-width: 180px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
            flex-shrink: 0;
        }

        .slide-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .slide-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgb(79 70 229 / 0.2);
            transform: scale(1.05);
        }

        .slide-thumbnail {
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            position: relative;
        }

        .slide-number {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.625rem;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
        }

        .slide-title {
            padding: 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
            border-top: 1px solid var(--border);
            background: var(--background);
        }

        .export-actions {
            display: flex;
            gap: 0.75rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .export-btn {
            flex: 1;
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: var(--radius-md);
            padding: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .export-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .export-btn.primary {
            background: var(--primary-color);
            color: white;
        }

        .transcript-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .transcript-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .transcript-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .transcript-style-select {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            background: var(--background);
            color: var(--text-primary);
            cursor: pointer;
        }

        .transcript-content {
            max-height: 600px;
            overflow-y: auto;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .transcript-loading {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }

        .slide-transcript {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-light);
        }

        .slide-transcript:last-child {
            border-bottom: none;
        }

        .slide-transcript-header {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .slide-transcript-time {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .slide-transcript-text {
            color: var(--text-primary);
            line-height: 1.8;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .preview-panel {
                position: static;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="#" class="logo">
                <div class="logo-icon">📊</div>
                簡報AI
            </a>
        </div>
    </header>

    <main class="main-container">
        <section class="input-panel">
            <div class="panel-header">
                <h2 class="panel-title">建立您的簡報</h2>
                <p class="panel-subtitle">輸入您的內容，讓AI為您生成專業簡報</p>
            </div>

            <div class="input-group">
                <label class="input-label" for="title-input">
                    📌 簡報標題
                    <span style="color: var(--text-secondary); font-weight: normal;">(可選)</span>
                </label>
                <input
                    type="text"
                    id="title-input"
                    class="title-input"
                    placeholder="輸入簡報標題，留空則由AI自動生成..."
                    maxlength="50"
                />
                <div style="margin-top: 0.25rem; font-size: 0.75rem; color: var(--text-muted);">
                    💡 提示：提供簡短標題可避免檔名過長問題
                </div>
            </div>

            <div class="input-group">
                <label for="content-input" class="input-label">內容輸入</label>
                <textarea
                    id="content-input"
                    class="text-input"
                    placeholder="請在此處貼上或輸入您的內容...

範例：
• 會議記錄
• 課程大綱
• 產品介紹
• 研究成果
• 商業提案

AI 將自動分析您的內容並建立結構化的投影片。"
                ></textarea>
                <div class="input-meta">
                    <span>至少需要 50 個字元</span>
                    <span class="char-count" id="char-count">0 個字元</span>
                </div>
            </div>

            <div class="input-group">
                <label for="slide-count" class="input-label">投影片數量</label>
                <div class="slide-count-control">
                    <button type="button" class="slide-count-btn" id="decrease-slides">−</button>
                    <input type="number" class="slide-count-input" id="slide-count" value="6" min="3" max="12" readonly>
                    <button type="button" class="slide-count-btn" id="increase-slides">+</button>
                </div>
                <div class="input-meta" style="margin-top: 0.5rem;">
                    <span style="color: var(--text-muted); font-size: 0.75rem;">範圍：3-12 張投影片</span>
                </div>
            </div>

            <div class="input-group">
                <label for="template-select" class="input-label">模版樣式</label>
                <select id="template-select" style="width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: var(--radius-md); font-size: 0.875rem; background: var(--background); color: var(--text-primary); cursor: pointer; transition: all 0.2s ease;">
                    <option value="general">General - 一般樣式</option>
                    <option value="modern">Modern - 現代樣式</option>
                    <option value="standard">Standard - 標準樣式</option>
                    <option value="swift">Swift - 簡潔樣式</option>
                </select>
            </div>

            <div class="input-group">
                <label class="input-label">
                    📁 自訂模板上傳
                    <span style="color: var(--text-secondary); font-weight: normal;">(可選)</span>
                </label>

                <div class="template-upload-container">
                    <input
                        type="file"
                        id="template-upload"
                        accept=".pptx"
                        style="display: none;"
                    />

                    <button
                        type="button"
                        id="template-upload-btn"
                        class="template-upload-btn"
                    >
                        <span>📤 選擇PPTX模板</span>
                    </button>

                    <div id="template-upload-status" class="template-upload-status" style="display: none;">
                        <span class="template-filename"></span>
                        <button type="button" id="template-remove-btn" class="template-remove-btn">✕</button>
                    </div>
                </div>

                <div style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-muted);">
                    💡 上傳您的PPTX模板檔案，系統將使用它生成簡報
                </div>
            </div>

            <div class="input-group">
                <label for="theme-select" class="input-label">佈景主題</label>
                <select id="theme-select" style="width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: var(--radius-md); font-size: 0.875rem; background: var(--background); color: var(--text-primary); cursor: pointer; transition: all 0.2s ease;">
                    <option value="">無（使用預設）</option>
                    <option value="edge-yellow">Edge Yellow - 邊緣黃</option>
                    <option value="mint-blue">Mint Blue - 薄荷藍</option>
                    <option value="light-rose">Light Rose - 淺玫瑰紅</option>
                    <option value="professional-blue">Professional Blue - 專業藍</option>
                    <option value="professional-dark">Professional Dark - 專業黑</option>
                </select>
            </div>

            <div class="action-buttons">
                <button id="generate-btn" class="btn btn-primary" disabled>
                    <span>✨ 生成簡報</span>
                </button>
                <button id="clear-btn" class="btn btn-secondary">
                    <span>🗑️ 清除</span>
                </button>
            </div>
        </section>

        <section class="middle-panel">
            <div id="progress-section" class="progress-section">
                <div class="progress-icon">⚡</div>
                <div class="progress-text" id="progress-text">正在分析內容...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-percentage" id="progress-percentage">0%</div>
            </div>

            <div id="results-section" class="results-section">
                <div class="results-header">
                    <div class="panel-title">簡報已準備完成</div>
                    <div class="results-meta" id="results-meta">已生成 6 張投影片</div>
                </div>

                <div class="slides-grid" id="slides-grid"></div>

                <div class="export-actions">
                    <button class="export-btn primary" id="download-pptx">
                        📄 下載 PowerPoint
                    </button>
                    <button class="export-btn" id="download-pdf">
                        📑 下載 PDF
                    </button>
                    <button class="export-btn" id="generate-transcript">
                        🎤 生成演講稿
                    </button>
                </div>

                <div class="transcript-section" id="transcript-section" style="display: none;">
                    <div class="transcript-header">
                        <h3 class="transcript-title">演講稿</h3>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <select id="transcript-style" class="transcript-style-select">
                                <option value="educational">教學式</option>
                                <option value="formal">正式</option>
                                <option value="conversational">對話式</option>
                            </select>
                            <button class="export-btn primary" id="download-transcript" style="margin: 0;" disabled>
                                💾 下載演講稿
                            </button>
                        </div>
                    </div>
                    <div class="transcript-content" id="transcript-content">
                        <div class="transcript-loading">正在生成演講稿...</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="preview-panel">
            <div id="slide-preview" class="slide-preview">
                <div class="slide-preview-empty">
                    點擊投影片以預覽
                </div>
            </div>

            <div id="slide-preview-transcript" class="slide-preview-transcript" style="display: none;">
                <h4>投影片演講稿</h4>
                <p id="slide-transcript-text">請先生成演講稿</p>
            </div>
        </section>
    </main>

    <script>
        const API_BASE_URL = 'http://localhost:5050/api';

        class PresentationApp {
            constructor() {
                this.selectedTemplate = 'general';
                this.selectedTheme = null;
                this.currentPresentation = null;
                this.presentationId = null;
                this.selectedSlideIndex = null;
                this.transcriptData = null;
                this.slideDetailsCache = {};
                this.uploadedTemplateFile = null;
                this.init();
            }

            init() {
                this.bindElements();
                this.bindEvents();
                this.updateCharCount();
            }

            bindElements() {
                this.titleInput = document.getElementById('title-input');
                this.contentInput = document.getElementById('content-input');
                this.charCount = document.getElementById('char-count');
                this.generateBtn = document.getElementById('generate-btn');
                this.clearBtn = document.getElementById('clear-btn');

                // Slide count controls
                this.slideCountInput = document.getElementById('slide-count');
                this.decreaseBtn = document.getElementById('decrease-slides');
                this.increaseBtn = document.getElementById('increase-slides');

                // Template and theme selects
                this.templateSelect = document.getElementById('template-select');
                this.themeSelect = document.getElementById('theme-select');

                // Progress and results
                this.progressSection = document.getElementById('progress-section');
                this.resultsSection = document.getElementById('results-section');
                this.progressText = document.getElementById('progress-text');
                this.progressFill = document.getElementById('progress-fill');
                this.progressPercentage = document.getElementById('progress-percentage');

                // Slides
                this.slidesGrid = document.getElementById('slides-grid');
                this.resultsMeta = document.getElementById('results-meta');

                // Transcript
                this.transcriptSection = document.getElementById('transcript-section');
                this.transcriptContent = document.getElementById('transcript-content');
                this.transcriptStyle = document.getElementById('transcript-style');
                this.downloadTranscriptBtn = document.getElementById('download-transcript');

                // Template upload
                this.templateUploadInput = document.getElementById('template-upload');
                this.templateUploadBtn = document.getElementById('template-upload-btn');
                this.templateUploadStatus = document.getElementById('template-upload-status');
                this.templateRemoveBtn = document.getElementById('template-remove-btn');

                // Preview panel
                this.slidePreview = document.getElementById('slide-preview');
                this.slidePreviewTranscript = document.getElementById('slide-preview-transcript');
                this.slideTranscriptText = document.getElementById('slide-transcript-text');
            }

            bindEvents() {
                this.contentInput.addEventListener('input', () => this.updateCharCount());
                this.generateBtn.addEventListener('click', () => this.generatePresentation());
                this.clearBtn.addEventListener('click', () => this.clearContent());

                // Slide count controls
                this.decreaseBtn.addEventListener('click', () => this.adjustSlideCount(-1));
                this.increaseBtn.addEventListener('click', () => this.adjustSlideCount(1));

                // Template and theme selects
                this.templateSelect.addEventListener('change', (e) => {
                    this.selectedTemplate = e.target.value;
                });

                this.themeSelect.addEventListener('change', (e) => {
                    this.selectedTheme = e.target.value || null;
                });

                // Download and transcript
                document.getElementById('download-pptx').addEventListener('click', () => {
                    this.downloadFile('pptx');
                });

                document.getElementById('download-pdf').addEventListener('click', () => {
                    this.downloadFile('pdf');
                });

                document.getElementById('generate-transcript').addEventListener('click', () => {
                    this.generateTranscript();
                });

                document.getElementById('download-transcript').addEventListener('click', () => {
                    this.downloadTranscript();
                });

                this.templateUploadBtn.addEventListener('click', () => {
                    this.templateUploadInput.click();
                });

                this.templateUploadInput.addEventListener('change', (e) => {
                    this.handleTemplateUpload(e);
                });

                this.templateRemoveBtn.addEventListener('click', () => {
                    this.clearUploadedTemplate();
                });
            }

            adjustSlideCount(delta) {
                const current = parseInt(this.slideCountInput.value);
                const min = parseInt(this.slideCountInput.min);
                const max = parseInt(this.slideCountInput.max);
                const newValue = Math.max(min, Math.min(max, current + delta));

                this.slideCountInput.value = newValue;

                // Update button states
                this.decreaseBtn.disabled = newValue <= min;
                this.increaseBtn.disabled = newValue >= max;
            }

            updateCharCount() {
                const length = this.contentInput.value.length;
                this.charCount.textContent = `${length} 個字元`;
                this.generateBtn.disabled = length < 50;
            }

            clearContent() {
                this.contentInput.value = '';
                this.updateCharCount();
                this.selectedSlideIndex = null;
                this.transcriptData = null;
                this.progressSection.style.display = 'none';
                this.resultsSection.style.display = 'none';
            }

            async generatePresentation() {
                const content = this.contentInput.value.trim();
                if (content.length < 50) return;

                this.showProgressState();
                this.generateBtn.classList.add('btn-loading');
                this.generateBtn.disabled = true;

                try {
                    const title = this.titleInput.value.trim();
                    const nSlides = parseInt(this.slideCountInput.value);

                    let response;
                    if (this.uploadedTemplateFile) {
                        const formData = new FormData();
                        formData.append('template_file', this.uploadedTemplateFile);
                        formData.append('content', content);
                        if (title) formData.append('title', title);
                        formData.append('template', this.selectedTemplate);
                        formData.append('language', 'zh-TW');
                        formData.append('n_slides', nSlides);
                        if (this.selectedTheme) formData.append('theme', this.selectedTheme);
                        formData.append('enhance', 'false');

                        response = await fetch(`${API_BASE_URL}/generate-with-template`, {
                            method: 'POST',
                            body: formData
                        });
                    } else {
                        const payload = {
                            content: content,
                            template: this.selectedTemplate,
                            language: 'zh-TW',
                            n_slides: nSlides
                        };

                        if (title) {
                            payload.title = title;
                        }

                        if (this.selectedTheme) {
                            payload.theme = this.selectedTheme;
                        }

                        response = await fetch(`${API_BASE_URL}/generate`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                    }

                    if (!response.ok) {
                        throw new Error('生成請求失敗');
                    }

                    const { task_id } = await response.json();
                    await this.pollProgress(task_id);

                } catch (error) {
                    console.error('生成失敗:', error);
                    alert('生成簡報失敗，請稍後再試。\n錯誤: ' + error.message);
                    this.progressSection.style.display = 'none';
                    this.resultsSection.style.display = 'none';
                } finally {
                    this.generateBtn.classList.remove('btn-loading');
                    this.generateBtn.disabled = false;
                }
            }

            async pollProgress(taskId) {
                const maxAttempts = 600;  // 10 minutes (600 seconds)
                let attempts = 0;

                const poll = async () => {
                    if (attempts >= maxAttempts) {
                        throw new Error('生成超時');
                    }

                    try {
                        const response = await fetch(`${API_BASE_URL}/progress/${taskId}`);
                        const data = await response.json();

                        this.progressText.textContent = data.current_step || data.message;
                        this.progressFill.style.width = data.progress + '%';
                        this.progressPercentage.textContent = data.progress + '%';

                        if (data.status === 'completed') {
                            this.currentPresentation = data.presentation;
                            this.presentationId = data.presentation_id;
                            this.renderSlides(data.presentation.slides);
                            this.showResultsState();
                            return;
                        } else if (data.status === 'failed') {
                            throw new Error(data.message);
                        }

                        attempts++;
                        setTimeout(poll, 1000);
                    } catch (error) {
                        throw error;
                    }
                };

                await poll();
            }

            renderSlides(slides) {
                this.slidesGrid.innerHTML = '';
                this.resultsMeta.textContent = `已生成 ${slides.length} 張投影片`;

                slides.forEach((slide, index) => {
                    const slideElement = document.createElement('div');
                    slideElement.className = 'slide-card';
                    slideElement.dataset.slideIndex = index;

                    slideElement.innerHTML = `
                        <div class="slide-thumbnail">
                            <div class="slide-number">${index + 1}</div>
                            <div>${this.getSlideIcon(slide.type)}</div>
                        </div>
                        <div class="slide-title">${slide.title}</div>
                    `;

                    // Add click handler for slide preview
                    slideElement.addEventListener('click', () => {
                        this.selectSlide(index, slide);
                    });

                    this.slidesGrid.appendChild(slideElement);
                });

                // Auto-select first slide
                if (slides.length > 0) {
                    this.selectSlide(0, slides[0]);
                }
            }

            async selectSlide(index, slide) {
                // Update selected state
                document.querySelectorAll('.slide-card').forEach(card => {
                    card.classList.remove('selected');
                });
                document.querySelector(`.slide-card[data-slide-index="${index}"]`)?.classList.add('selected');

                this.selectedSlideIndex = index;

                // Fetch complete slide details if presentation_id available
                let detailedSlide = null;
                if (this.presentationId) {
                    const detailedData = await this.fetchSlideDetails(this.presentationId);
                    if (detailedData && detailedData.slides && detailedData.slides[index]) {
                        detailedSlide = detailedData.slides[index];
                    }
                }

                // Build preview HTML
                let previewHtml = `
                    <div style="display: flex; flex-direction: column; gap: 1.5rem; padding: 2rem;">
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <div style="font-size: 2rem;">${this.getSlideIcon(slide.type)}</div>
                            <div>
                                <div style="font-size: 1.5rem; font-weight: 600;">${slide.title}</div>
                                <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">
                                    類型: ${slide.type} | 投影片 ${index + 1}
                                </div>
                            </div>
                        </div>
                `;

                // Add detailed content if available
                if (detailedSlide) {
                    if (detailedSlide.layout) {
                        previewHtml += `
                            <div>
                                <div style="font-weight: 600; margin-bottom: 0.5rem;">佈局樣式</div>
                                <div style="padding: 0.75rem; background: var(--bg-secondary); border-radius: 6px; font-size: 0.875rem;">
                                    ${detailedSlide.layout_group} / ${detailedSlide.layout}
                                </div>
                            </div>
                        `;
                    }

                    if (detailedSlide.content) {
                        const renderedContent = this.renderSlideContent(detailedSlide.content);
                        previewHtml += `
                            <div>
                                <div style="font-weight: 600; margin-bottom: 0.5rem;">投影片內容</div>
                                <div style="padding: 1rem; background: var(--bg-secondary); border-radius: 6px; font-size: 0.875rem; max-height: 400px; overflow-y: auto;">
                                    ${renderedContent}
                                </div>
                            </div>
                        `;
                    }

                    if (detailedSlide.speaker_note) {
                        previewHtml += `
                            <div>
                                <div style="font-weight: 600; margin-bottom: 0.5rem;">演講者備註</div>
                                <div style="padding: 1rem; background: var(--bg-secondary); border-radius: 6px; font-size: 0.875rem;">
                                    ${detailedSlide.speaker_note}
                                </div>
                            </div>
                        `;
                    }
                } else {
                    // Basic content from generation response
                    if (slide.content && slide.content.length > 0) {
                        previewHtml += `
                            <div>
                                <div style="font-weight: 600; margin-bottom: 0.5rem;">內容要點</div>
                                <ul style="padding-left: 1.5rem; margin: 0;">
                                    ${slide.content.map(point => `<li style="margin-bottom: 0.5rem;">${point}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }

                    if (slide.image_url) {
                        previewHtml += `
                            <div>
                                <div style="font-weight: 600; margin-bottom: 0.5rem;">投影片圖片</div>
                                <img src="${slide.image_url}"
                                     alt="Slide image"
                                     style="max-width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                            </div>
                        `;
                    }
                }

                previewHtml += `</div>`;
                this.slidePreview.innerHTML = previewHtml;

                // Update transcript if available
                if (this.transcriptData && this.transcriptData.transcripts[index]) {
                    const transcript = this.transcriptData.transcripts[index];
                    this.slidePreviewTranscript.style.display = 'block';
                    this.slideTranscriptText.textContent = transcript.transcript;
                } else {
                    this.slidePreviewTranscript.style.display = 'none';
                }
            }

            handleTemplateUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                if (!file.name.endsWith('.pptx')) {
                    alert('❌ 請上傳PPTX格式的檔案');
                    this.templateUploadInput.value = '';
                    return;
                }

                const maxSize = 20 * 1024 * 1024;
                if (file.size > maxSize) {
                    alert('❌ 檔案大小不得超過20MB');
                    this.templateUploadInput.value = '';
                    return;
                }

                this.uploadedTemplateFile = file;
                this.templateUploadStatus.querySelector('.template-filename').textContent = file.name;
                this.templateUploadStatus.style.display = 'flex';
                this.templateUploadBtn.style.display = 'none';
            }

            clearUploadedTemplate() {
                this.uploadedTemplateFile = null;
                this.templateUploadInput.value = '';
                this.templateUploadStatus.style.display = 'none';
                this.templateUploadBtn.style.display = 'flex';
            }

            getSlideIcon(type) {
                const icons = {
                    title: '📋',
                    overview: '🗂️',
                    content: '📝',
                    conclusion: '🎯'
                };
                return icons[type] || '📄';
            }

            renderSlideContent(content) {
                if (!content || typeof content !== 'object') {
                    return '<div style="color: var(--text-secondary); font-style: italic;">無內容資料</div>';
                }

                const metadataFields = ['companyName', 'date', 'id', 'index', 'slideId', 'presentationId', 'createdAt', 'updatedAt'];
                const textFields = ['title', 'subtitle', 'heading', 'header'];
                const descriptionFields = ['description', 'text', 'paragraph', 'content', 'body'];
                const listFields = ['bullets', 'points', 'items', 'list'];

                let html = '';

                for (const [key, value] of Object.entries(content)) {
                    if (metadataFields.includes(key) || value === null || value === undefined || value === '') {
                        continue;
                    }

                    const displayKey = key.replace(/([A-Z])/g, ' $1').trim().replace(/^./, str => str.toUpperCase());

                    if (textFields.includes(key)) {
                        html += `
                            <div style="margin-bottom: 1rem;">
                                <div style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color);">${value}</div>
                            </div>
                        `;
                    } else if (descriptionFields.includes(key)) {
                        html += `
                            <div style="margin-bottom: 1rem;">
                                <div style="font-weight: 500; margin-bottom: 0.25rem;">${displayKey}</div>
                                <div style="line-height: 1.6; color: var(--text-primary);">${value}</div>
                            </div>
                        `;
                    } else if (listFields.includes(key) && Array.isArray(value)) {
                        html += `
                            <div style="margin-bottom: 1rem;">
                                <div style="font-weight: 500; margin-bottom: 0.25rem;">${displayKey}</div>
                                <ul style="margin: 0; padding-left: 1.5rem;">
                                    ${value.map(item => `<li style="margin-bottom: 0.25rem;">${item}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    } else if (Array.isArray(value)) {
                        html += `
                            <div style="margin-bottom: 1rem;">
                                <div style="font-weight: 500; margin-bottom: 0.25rem;">${displayKey}</div>
                                <div style="padding-left: 1rem;">
                                    ${value.map((item, idx) => {
                                        if (typeof item === 'object') {
                                            return `<div style="margin-bottom: 0.5rem;"><strong>${idx + 1}.</strong> ${JSON.stringify(item, null, 2)}</div>`;
                                        }
                                        return `<div style="margin-bottom: 0.25rem;">• ${item}</div>`;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    } else if (typeof value === 'object') {
                        html += `
                            <div style="margin-bottom: 1rem;">
                                <div style="font-weight: 500; margin-bottom: 0.25rem;">${displayKey}</div>
                                <div style="padding: 0.75rem; background: rgba(0,0,0,0.02); border-radius: 4px; font-size: 0.875rem;">
                                    <pre style="margin: 0; white-space: pre-wrap; font-family: inherit;">${JSON.stringify(value, null, 2)}</pre>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div style="margin-bottom: 0.75rem;">
                                <span style="font-weight: 500;">${displayKey}:</span>
                                <span style="margin-left: 0.5rem;">${value}</span>
                            </div>
                        `;
                    }
                }

                return html || '<div style="color: var(--text-secondary); font-style: italic;">無可顯示的內容</div>';
            }

            async fetchSlideDetails(presentationId) {
                if (this.slideDetailsCache[presentationId]) {
                    console.log('Using cached slide details');
                    return this.slideDetailsCache[presentationId];
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/presentation/${presentationId}`);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();
                    this.slideDetailsCache[presentationId] = data;
                    console.log('Fetched and cached slide details:', data);
                    return data;
                } catch (error) {
                    console.error('Failed to fetch slide details:', error);
                    return null;
                }
            }

            showProgressState() {
                this.progressSection.style.display = 'flex';
                this.resultsSection.style.display = 'none';
            }

            showResultsState() {
                this.progressSection.style.display = 'none';
                this.resultsSection.style.display = 'block';
            }

            downloadFile(format) {
                if (!this.presentationId) {
                    alert('請先生成簡報');
                    return;
                }
                
                const downloadUrl = `${API_BASE_URL}/download/${this.presentationId}/${format}`;
                window.open(downloadUrl, '_blank');
            }

            async generateTranscript() {
                if (!this.presentationId) {
                    alert('請先生成簡報');
                    return;
                }

                this.transcriptSection.style.display = 'block';
                this.transcriptContent.innerHTML = '<div class="transcript-loading">正在生成演講稿，請稍候...</div>';
                this.downloadTranscriptBtn.disabled = true;  // Disable download button during generation

                try {
                    const style = this.transcriptStyle.value;
                    
                    const response = await fetch(`${API_BASE_URL}/transcript/generate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            presentation_id: this.presentationId,
                            language: 'zh-TW',
                            style: style
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || '生成失敗');
                    }

                    const data = await response.json();
                    this.renderTranscript(data);

                } catch (error) {
                    console.error('生成演講稿失敗:', error);
                    this.transcriptContent.innerHTML = `
                        <div class="transcript-loading" style="color: var(--text-secondary);">
                            ⚠️ 生成演講稿失敗<br>
                            ${error.message}<br><br>
                            ${error.message.includes('phi4-mini') ? 
                                '請先下載 Transcript 模型：<br><code>ollama pull phi4-mini-reasoning:3.8b</code>' : 
                                '請檢查服務狀態並重試'
                            }
                        </div>
                    `;
                }
            }

            renderTranscript(data) {
                // Store transcript data for slide preview
                this.transcriptData = data;

                const transcripts = data.transcripts || [];
                const totalMinutes = data.total_duration_minutes || 0;

                let html = `
                    <div style="padding: 1rem; background: var(--background); border-radius: var(--radius-sm); margin-bottom: 1rem;">
                        <strong>預估演講時間:</strong> ${totalMinutes} 分鐘 |
                        <strong>投影片數量:</strong> ${data.total_slides}
                    </div>
                `;

                transcripts.forEach(slide => {
                    const minutes = Math.floor(slide.duration_seconds / 60);
                    const seconds = slide.duration_seconds % 60;
                    const timeStr = minutes > 0 ?
                        `${minutes}分${seconds}秒` :
                        `${seconds}秒`;

                    html += `
                        <div class="slide-transcript">
                            <div class="slide-transcript-header">
                                投影片 ${slide.slide_number}: ${slide.title}
                            </div>
                            <div class="slide-transcript-time">
                                預估時間: ${timeStr}
                            </div>
                            <div class="slide-transcript-text">
                                ${slide.transcript}
                            </div>
                        </div>
                    `;
                });

                this.transcriptContent.innerHTML = html;
                this.downloadTranscriptBtn.disabled = false;  // Enable download button after successful rendering

                // Update preview panel if a slide is selected
                if (this.selectedSlideIndex !== null && this.currentPresentation) {
                    const slide = this.currentPresentation.slides[this.selectedSlideIndex];
                    this.selectSlide(this.selectedSlideIndex, slide);
                }
            }

            downloadTranscript() {
                if (!this.presentationId) {
                    alert('請先生成演講稿');
                    return;
                }

                const downloadUrl = `${API_BASE_URL}/transcript/${this.presentationId}/download`;
                window.open(downloadUrl, '_blank');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new PresentationApp();
        });
    </script>
</body>
</html>
